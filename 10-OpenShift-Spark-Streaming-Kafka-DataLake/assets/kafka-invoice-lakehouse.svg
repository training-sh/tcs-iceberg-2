<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-labelledby="title desc">
<title id="title">Kafka invoice streaming to an Iceberg lake</title><desc id="desc">The Jupyter producer writes to Kafka. A separate consumer observes offsets. Spark ingests raw deliveries into Bronze, rejects invalid records and deduplicates Silver by LineID. A second sequential Spark application streams Silver changes to country totals. Polaris resolves the tables and SeaweedFS stores objects and checkpoints.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1180" height="660" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="44" font-size="25" font-weight="bold">Invoice events → Kafka → Spark → Iceberg</text><text x="30" y="75" font-size="16" fill="#475569">Existing services; one Spark application at a time</text>
<g fill="#e0f2fe" stroke="#0284c7"><rect x="30" y="150" width="190" height="100" rx="12"/><rect x="280" y="150" width="190" height="100" rx="12"/><rect x="280" y="365" width="190" height="110" rx="12"/></g>
<g text-anchor="middle"><text x="125" y="188" font-size="21" font-weight="bold">Producer</text><text x="125" y="217" font-size="16">Jupyter invoice JSON</text><text x="375" y="188" font-size="21" font-weight="bold">Kafka :9092</text><text x="375" y="217" font-size="16">Partition log + offsets</text><text x="375" y="402" font-size="21" font-weight="bold">Consumer</text><text x="375" y="432" font-size="16">Separate observer group</text><text x="375" y="455" font-size="15">Explicit next-offset commit</text></g>
<rect x="535" y="150" width="240" height="100" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="655" y="188" text-anchor="middle" font-size="21" font-weight="bold">Spark micro-batch</text><text x="655" y="217" text-anchor="middle" font-size="16">Validate + keyed MERGE</text>
<g fill="#dcfce7" stroke="#16a34a"><rect x="865" y="105" width="270" height="80" rx="12"/><rect x="865" y="210" width="270" height="80" rx="12"/><rect x="865" y="315" width="270" height="80" rx="12"/><rect x="865" y="470" width="270" height="85" rx="12"/></g>
<g text-anchor="middle"><text x="1000" y="138" font-size="21" font-weight="bold">Bronze</text><text x="1000" y="163" font-size="15">One row per Kafka delivery</text><text x="1000" y="243" font-size="21" font-weight="bold">Silver</text><text x="1000" y="268" font-size="15">One accepted immutable LineID</text><text x="1000" y="348" font-size="21" font-weight="bold">Rejects</text><text x="1000" y="373" font-size="15">Invalid raw deliveries + reason</text><text x="1000" y="503" font-size="21" font-weight="bold">Country totals</text><text x="1000" y="531" font-size="15">Distinct invoices + decimal amount</text></g>
<rect x="30" y="540" width="330" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="195" y="573" text-anchor="middle" font-size="21" font-weight="bold">Polaris REST catalog</text><text x="195" y="599" text-anchor="middle" font-size="15">Table names, metadata pointers, grants</text><rect x="440" y="540" width="330" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="605" y="573" text-anchor="middle" font-size="21" font-weight="bold">SeaweedFS S3 :8333</text><text x="605" y="599" text-anchor="middle" font-size="15">Iceberg files + separate checkpoints</text>
