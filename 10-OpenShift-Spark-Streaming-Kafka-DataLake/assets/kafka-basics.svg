<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">Kafka orders architecture on OpenShift</title><desc id="desc">Console producer sends orders to four partitions on one Kafka broker. Consumer groups read independently. ZooKeeper coordinates the broker. Persistent storage holds logs. Spark connects Kafka to Polaris and SeaweedFS.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#475569"/></marker></defs>
<rect width="1100" height="540" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="30" y="38" font-size="25" font-weight="bold">Kafka on OpenShift · namespace bigdata</text>
<g fill="#e0f2fe" stroke="#0284c7" stroke-width="2"><rect x="25" y="175" width="200" height="110" rx="12"/><rect x="315" y="90" width="365" height="260" rx="12"/><rect x="775" y="110" width="290" height="75" rx="12"/><rect x="775" y="230" width="290" height="75" rx="12"/></g>
<text x="45" y="213" font-size="20" font-weight="bold">Console producer</text><text x="45" y="244" font-size="17">JSON order records</text><text x="45" y="269" font-size="17">optional customer key</text>
<text x="335" y="124" font-size="21" font-weight="bold">Kafka broker: kafka-0</text><text x="335" y="153" font-size="17">orders-demo · replication factor 1</text>
<g fill="#fff" stroke="#0284c7"><rect x="337" y="178" width="320" height="31"/><rect x="337" y="217" width="320" height="31"/><rect x="337" y="256" width="320" height="31"/><rect x="337" y="295" width="320" height="31"/></g>
<g font-size="17"><text x="350" y="200">P0: offset 0 → 1 → 2 → …</text><text x="350" y="239">P1: offset 0 → 1 → 2 → …</text><text x="350" y="278">P2: offset 0 → 1 → 2 → …</text><text x="350" y="317">P3: offset 0 → 1 → 2 → …</text></g>
<text x="794" y="141" font-size="20" font-weight="bold">Console consumer group</text><text x="794" y="168" font-size="17">assignments + committed offsets</text><text x="794" y="262" font-size="20" font-weight="bold">Spark streaming</text><text x="794" y="289" font-size="17">independent Kafka reader</text>
<g fill="#fef3c7" stroke="#d97706" stroke-width="2"><rect x="315" y="405" width="175" height="85" rx="10"/><rect x="515" y="405" width="165" height="85" rx="10"/><rect x="775" y="385" width="290" height="105" rx="10"/></g>
<text x="332" y="439" font-size="20" font-weight="bold">ZooKeeper</text><text x="332" y="468" font-size="16">coordination</text><text x="531" y="439" font-size="20" font-weight="bold">Broker PVC</text><text x="531" y="468" font-size="16">partition logs</text><text x="794" y="420" font-size="20" font-weight="bold">Iceberg data lake</text><text x="794" y="450" font-size="17">Polaris: catalog metadata</text><text x="794" y="476" font-size="17">SeaweedFS: S3 data files</text>
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M225 230H315"/><path d="M680 150H775"/><path d="M680 270H775"/><path d="M402 405V350"/><path d="M597 350V405"/><path d="M920 305V385"/></g>
<text x="31" y="524" font-size="16">One broker, four partitions. Ordering is per partition; separate consumer groups replay independently.</text></g></svg>
