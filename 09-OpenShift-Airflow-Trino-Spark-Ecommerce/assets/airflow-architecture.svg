<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Airflow architecture on the existing OpenShift stack</title><desc id="desc">A host publishes DAG files. Inside airflow-0, the DAG processor, API server, scheduler and LocalExecutor coordinate task processes. PostgreSQL stores orchestration state. Tasks call Trino or create a Spark driver Job that submits work to the existing Spark master and worker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1200" height="780" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="44" font-size="25" font-weight="bold">Airflow coordinates; Trino and Spark execute</text><text x="30" y="74" font-size="16" fill="#475569">Several Airflow components are processes in one existing pod, not separate services.</text>
<rect x="245" y="110" width="620" height="455" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="265" y="142" font-size="21" font-weight="bold">airflow-0: existing standalone / LocalExecutor</text>
<g fill="#e0f2fe" stroke="#0284c7"><rect x="25" y="170" width="170" height="90" rx="12"/><rect x="25" y="345" width="170" height="105" rx="12"/></g>
<text x="110" y="204" text-anchor="middle" font-size="18" font-weight="bold">Linux browser</text><text x="110" y="232" text-anchor="middle" font-size="16">Airflow UI</text><text x="110" y="378" text-anchor="middle" font-size="18" font-weight="bold">Host source files</text><text x="110" y="406" text-anchor="middle" font-size="16">.py / .sql</text><text x="110" y="430" text-anchor="middle" font-size="15">Explicit oc cp</text>
<g fill="#ffedd5" stroke="#ea580c"><rect x="285" y="170" width="245" height="90" rx="12"/><rect x="575" y="170" width="245" height="90" rx="12"/><rect x="285" y="320" width="245" height="90" rx="12"/><rect x="575" y="320" width="245" height="90" rx="12"/><rect x="395" y="465" width="310" height="70" rx="12"/></g>
<g text-anchor="middle"><text x="407" y="205" font-size="19" font-weight="bold">API server + UI</text><text x="407" y="233" font-size="15">Inspect / trigger / task runtime API</text><text x="697" y="205" font-size="19" font-weight="bold">DAG processor</text><text x="697" y="233" font-size="15">Parse files and publish definitions</text><text x="407" y="355" font-size="19" font-weight="bold">Scheduler</text><text x="407" y="383" font-size="15">Dependencies, state and limits</text><text x="697" y="355" font-size="19" font-weight="bold">LocalExecutor</text><text x="697" y="383" font-size="15">Task processes in this pod</text><text x="550" y="494" font-size="19" font-weight="bold">Task log storage / Airflow PVC</text><text x="550" y="519" font-size="15">Execution output, errors and attempts</text></g>
<rect x="305" y="640" width="410" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="510" y="675" text-anchor="middle" font-size="21" font-weight="bold">Existing PostgreSQL</text><text x="510" y="705" text-anchor="middle" font-size="16">airflow_metadata: workflow state, not business rows</text>
<g fill="#dcfce7" stroke="#16a34a"><rect x="930" y="170" width="240" height="90" rx="12"/><rect x="930" y="340" width="240" height="100" rx="12"/><rect x="930" y="550" width="240" height="110" rx="12"/></g>
<g text-anchor="middle"><text x="1050" y="205" font-size="20" font-weight="bold">Trino</text><text x="1050" y="234" font-size="16">SQL through HTTP API</text><text x="1050" y="374" font-size="20" font-weight="bold">Spark driver Job</text><text x="1050" y="402" font-size="16">Existing Spark image</text><text x="1050" y="425" font-size="15">Client-mode spark-submit</text><text x="1050" y="586" font-size="20" font-weight="bold">Spark master / worker</text><text x="1050" y="614" font-size="16">Existing resource allocation</text><text x="1050" y="639" font-size="16">Executor computes the report</text></g>
<g fill="none" stroke="#475569" stroke-width="2.3" marker-end="url(#arrow)"><path d="M195 215H285"/><path d="M195 395L245 290H697V260"/><path d="M530 365H575"/><path d="M697 260V290H845V610H510V640"/><path d="M407 410V605H475V640"/><path d="M697 410L620 465"/><path d="M820 345L900 215H930"/><path d="M820 385H930"/><path d="M1050 440V550"/></g>
<text x="875" y="298" font-size="14">Call SQL</text><text x="865" y="418" font-size="14">Create / wait</text><text x="30" y="756" font-size="16" fill="#475569">Trino and Spark use the existing Polaris / SeaweedFS Iceberg tables. No additional Airflow executor fleet is introduced.</text></g></svg>
