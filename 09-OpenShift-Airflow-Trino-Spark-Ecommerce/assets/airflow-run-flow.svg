<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" role="img" aria-labelledby="title desc">
<title id="title">From a host source file to an Airflow task log</title><desc id="desc">Publish source files, parse DAG definitions, trigger a DAG run in the UI, schedule an eligible task, execute work through Trino or Spark, record state and logs, then release successful downstream dependencies.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1160" height="580" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="44" font-size="25" font-weight="bold">Publishing is separate from running</text>
<g fill="#e0f2fe" stroke="#0284c7"><rect x="30" y="100" width="245" height="110" rx="12"/><rect x="315" y="100" width="245" height="110" rx="12"/><rect x="600" y="100" width="245" height="110" rx="12"/><rect x="885" y="100" width="245" height="110" rx="12"/></g>
<g text-anchor="middle"><text x="152" y="138" font-size="20" font-weight="bold">1. Publish files</text><text x="152" y="169" font-size="16">Host to Airflow DAG folder</text><text x="437" y="138" font-size="20" font-weight="bold">2. Parse DAG</text><text x="437" y="169" font-size="16">Definitions and dependencies</text><text x="722" y="138" font-size="20" font-weight="bold">3. Trigger in UI</text><text x="722" y="169" font-size="16">Create one manual run</text><text x="1007" y="138" font-size="20" font-weight="bold">4. Scheduler</text><text x="1007" y="169" font-size="16">Find the next eligible task</text></g>
<g fill="#dcfce7" stroke="#16a34a"><rect x="885" y="330" width="245" height="110" rx="12"/><rect x="600" y="330" width="245" height="110" rx="12"/><rect x="315" y="330" width="245" height="110" rx="12"/><rect x="30" y="330" width="245" height="110" rx="12"/></g>
<g text-anchor="middle"><text x="1007" y="368" font-size="20" font-weight="bold">5. Execute task</text><text x="1007" y="399" font-size="16">LocalExecutor task process</text><text x="722" y="368" font-size="20" font-weight="bold">6. Wait for work</text><text x="722" y="399" font-size="16">Trino query / Spark Job</text><text x="437" y="368" font-size="20" font-weight="bold">7. Record outcome</text><text x="437" y="399" font-size="16">State, logs and small XCom</text><text x="152" y="368" font-size="20" font-weight="bold">8. Continue or stop</text><text x="152" y="399" font-size="16">Apply downstream conditions</text></g>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"><path d="M275 155H315"/><path d="M560 155H600"/><path d="M845 155H885"/><path d="M1007 210V330"/><path d="M885 385H845"/><path d="M600 385H560"/><path d="M315 385H275"/></g>
<text x="30" y="499" font-size="18" font-weight="bold">Introduction DAG: begin → query_trino → finish</text><text x="30" y="532" font-size="16" fill="#475569">The UI shows each task instance and attempt. An accepted SQL request or created Job is not yet completed work.</text></g></svg>
