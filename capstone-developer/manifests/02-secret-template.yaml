apiVersion: v1
kind: Secret
metadata:
  name: lab-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  database-user: team
  database-password: team1234
  s3-access-key: team
  s3-secret-key: team1234
  polaris-client-id: team
  polaris-client-secret: team1234
  polaris-bootstrap-credentials: POLARIS,team,team1234
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  user: team
  password: team1234
  root-password: team1234
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  s3.json: "{\n  \"identities\": [\n    {\n      \"name\": \"team\"\
    ,\n      \"credentials\": [{\"accessKey\": \"team\", \"secretKey\"\
    : \"team1234\"}],\n      \"actions\": [\"Admin\", \"Read\", \"Write\"\
    , \"List\", \"Tagging\"]\n    }\n  ]\n}\n"
