apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbac-hello
  namespace: rbac-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rbac-hello
  template:
    metadata:
      labels:
        app: rbac-hello
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hello
        image: docker.io/library/busybox:1.37
        command: [sh, -c]
        args:
        - 'while true; do echo "RBAC demo: the pod is running"; sleep 30; done'
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
