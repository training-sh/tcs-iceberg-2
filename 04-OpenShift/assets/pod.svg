<text x="52" y="90" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#182536">A node contains Pods; a Pod contains containers</text>
<text x="52" y="144" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526174">A project groups API resources. Its Pods can be scheduled on different nodes.</text>
