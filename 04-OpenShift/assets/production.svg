<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">A production cluster spans several machines</title><desc id="desc">Example: three control-plane nodes and three workers across three failure zones.</desc>
