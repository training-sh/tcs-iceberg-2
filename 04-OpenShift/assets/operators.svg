<text x="79" y="577" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Coordinates the platform release payload</text>
<text x="79" y="609" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Works with individual Cluster Operators</text>
