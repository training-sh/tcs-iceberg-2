<text x="989" y="322" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Deployments + Pods</text>
<text x="989" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Services + certificates</text>
<text x="989" y="386" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Configuration</text>
