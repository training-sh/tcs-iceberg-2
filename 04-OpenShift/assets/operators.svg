<text x="52" y="90" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#182536">Operators manage the platform continuously</text>
<text x="52" y="144" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526174">An Operator is a controller with knowledge of how to run a particular system.</text>
