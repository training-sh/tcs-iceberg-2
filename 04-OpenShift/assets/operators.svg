<text x="79" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Example: IngressController</text>
<text x="79" y="386" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Replicas, domain, TLS settings</text>
