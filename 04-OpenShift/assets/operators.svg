<text x="534" y="322" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Watch current state</text>
<text x="534" y="354" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Create or update resources</text>
<text x="534" y="386" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Report health and progress</text>
