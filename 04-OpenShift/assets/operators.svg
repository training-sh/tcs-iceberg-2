<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Operators manage the platform continuously</title><desc id="desc">An Operator is a controller with knowledge of how to run a particular system.</desc>
