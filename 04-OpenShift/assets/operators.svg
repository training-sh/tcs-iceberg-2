<text x="759" y="609" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Coordinates required node changes and reboots</text>
<text x="52" y="768" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526174">Configure the supported API object. Manual edits to generated resources can be overwritten.</text>
