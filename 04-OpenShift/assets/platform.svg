<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Kubernetes inside an application platform</title><desc id="desc">OpenShift keeps Kubernetes objects and adds an integrated operational layer.</desc>
<rect width="1440" height="810" fill="#f7f9fc"/>
<rect width="1440" height="9" fill="#c9190b"/>
<text x="52" y="44" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c9190b">OPENSHIFT</text>
<text x="52" y="90" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#182536">Kubernetes inside an application platform</text>
<text x="52" y="144" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526174">OpenShift keeps Kubernetes objects and adds an integrated operational layer.</text>
<rect x="90" y="215" width="1260" height="125" rx="14" fill="white" stroke="#23785a" stroke-width="2"/>
<rect x="91" y="231" width="5" height="93" fill="#23785a"/>
<text x="114" y="254" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23785a">Applications</text>
<text x="114" y="292" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Web services  |  APIs  |  Data pipelines  |  Stateful workloads</text>
<rect x="90" y="365" width="1260" height="150" rx="14" fill="white" stroke="#c9190b" stroke-width="2"/>
<rect x="91" y="381" width="5" height="118" fill="#c9190b"/>
<text x="114" y="404" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#c9190b">OpenShift platform</text>
<text x="114" y="442" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Identity + RBAC  |  Routes + routers  |  Console + oc  |  Operators</text>
<text x="114" y="474" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Monitoring  |  Image workflows  |  Cluster and node lifecycle</text>
<rect x="90" y="540" width="610" height="145" rx="14" fill="white" stroke="#2266a5" stroke-width="2"/>
<rect x="91" y="556" width="5" height="113" fill="#2266a5"/>
<text x="114" y="579" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2266a5">Kubernetes</text>
<text x="114" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">API  |  Scheduling  |  Controllers</text>
<text x="114" y="649" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Pods  |  Services  |  Persistent volumes</text>
<rect x="725" y="540" width="625" height="145" rx="14" fill="white" stroke="#23785a" stroke-width="2"/>
<rect x="726" y="556" width="5" height="113" fill="#23785a"/>
<text x="749" y="579" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23785a">Node operating system</text>
<text x="749" y="617" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">CoreOS  |  kubelet  |  CRI-O</text>
<text x="749" y="649" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182536">Machines, network and storage</text>
<text x="52" y="768" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526174">A Deployment is still a Kubernetes Deployment. OpenShift adds platform APIs and managed services.</text>
</svg>