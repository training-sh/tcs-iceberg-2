apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana-http
  namespace: bigdata
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: prometheus-api-http
  namespace: bigdata
spec:
  to:
    kind: Service
    name: prometheus
  port:
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: loki-http
  namespace: bigdata
spec:
  to:
    kind: Service
    name: loki
  port:
    targetPort: http
