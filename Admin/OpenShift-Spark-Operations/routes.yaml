apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ops-jupyter
  namespace: bigdata
  labels:
    app.kubernetes.io/part-of: spark-operations-workshop
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: spark-master
  port:
    targetPort: jupyter
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
