apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ops-seaweed-s3
  namespace: bigdata
  labels:
    app.kubernetes.io/part-of: spark-operations-workshop
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: seaweedfs
  port:
    targetPort: s3
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
