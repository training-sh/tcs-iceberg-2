apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: olist-seller-ops
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\nscrape_configs:\n- job_name: olist\n\
    \  static_configs:\n  - targets:\n    - ops-metrics:8000\n- http_headers:\n  \
    \  X-Trino-User:\n      values:\n      - team\n  job_name: trino\n  static_configs:\n\
    \  - targets:\n    - trino:8080\n"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: olist-seller-ops
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: olist-seller-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: olist-workloads
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: quay.io/okd/scos-content@sha256:eb3c7c94f43aedd70fe7c885e5899890c3ad1a778b3e07fda36740a0cc24cc89
        command:
        - /bin/prometheus
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=6h
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 9090
          initialDelaySeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
