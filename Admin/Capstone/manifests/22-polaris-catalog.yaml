apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-catalog
  namespace: olist-seller-ops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: olist-workloads
      automountServiceAccountToken: false
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: catalog-setup
        image: image-registry.openshift-image-registry.svc:5000/bigdata/dataeng-spark@sha256:9a7752bfdaacb6886abdbdbcf4aafd3830dad75e8385e0281882e1916cc2ed8a
        args:
        - /app/configure_catalog.py
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: s3-access-key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: s3-secret-key
        - name: POLARIS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: polaris-client-id
        - name: POLARIS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: lab-credentials
              key: polaris-client-secret
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=1
        envFrom:
        - configMapRef:
            name: seller-settings
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: code
          mountPath: /app
        - name: work
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - python3
      volumes:
      - name: code
        configMap:
          name: seller-code
      - name: work
        emptyDir: {}
