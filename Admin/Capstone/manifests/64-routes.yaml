apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spark-ui
  namespace: olist-seller-ops
spec:
  to:
    kind: Service
    name: spark-master
  port:
    targetPort: master-ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
  namespace: olist-seller-ops
spec:
  to:
    kind: Service
    name: grafana
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
