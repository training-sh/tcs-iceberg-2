        app: datanode
    spec:
      enableServiceLinks: false
      serviceAccountName: olist-workloads
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: datanode
        image: image-registry.openshift-image-registry.svc:5000/bigdata/dataeng-hadoop@sha256:494a73dfb31b6cf117e588e22009da8d7446b997a5d9a6f7ec64910cdc27c2f7
        args:
        - datanode
        env:
        - name: DATANODE_HOST
          value: datanode.olist-seller-ops.svc.cluster.local
        - name: HADOOP_HEAPSIZE_MAX
          value: '192'
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=1
        ports:
        - name: web
          containerPort: 9864
        - name: data
          containerPort: 9866
        - name: ipc
          containerPort: 9867
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 640Mi
        volumeMounts:
        - name: data
          mountPath: /data
        startupProbe:
          tcpSocket:
            port: web
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: web
          periodSeconds: 10
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      automountServiceAccountToken: false
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
