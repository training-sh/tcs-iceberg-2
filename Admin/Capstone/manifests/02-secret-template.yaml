apiVersion: v1
kind: Secret
metadata:
  name: lab-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  database-user: team
  database-password: REPLACE_DB_PASSWORD
  s3-access-key: REPLACE_ACCESS_KEY
  s3-secret-key: REPLACE_SECRET_KEY
  polaris-client-id: team
  polaris-client-secret: REPLACE_POLARIS_SECRET
  polaris-bootstrap-credentials: POLARIS,team,REPLACE_POLARIS_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  user: team
  password: REPLACE_DB_PASSWORD
  root-password: REPLACE_ROOT_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-credentials
  namespace: olist-seller-ops
type: Opaque
stringData:
  s3.json: "{\n  \"identities\": [\n    {\n      \"name\": \"REPLACE_ACCESS_KEY\"\
    ,\n      \"credentials\": [{\"accessKey\": \"REPLACE_ACCESS_KEY\", \"secretKey\"\
    : \"REPLACE_SECRET_KEY\"}],\n      \"actions\": [\"Admin\", \"Read\", \"Write\"\
    , \"List\", \"Tagging\"]\n    }\n  ]\n}\n"
