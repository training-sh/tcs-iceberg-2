<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 630" width="1440" height="630" role="img" aria-label="How Grafana runs a query">
<rect x="0" y="0" width="1440" height="630" rx="0" fill="#0e192d" stroke="none" stroke-width="2"/>
<rect x="48" y="47" width="50" height="5" rx="2" fill="#64dfed" stroke="none" stroke-width="2"/>
<text x="48" y="111" fill="#f6faff" font-size="49" font-weight="700" font-family="Segoe UI, Arial, sans-serif">How Grafana runs a query</text>
<text x="48" y="151" fill="#b7c8df" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif">The selected data source determines where the Grafana server sends the query.</text>
<text x="48" y="216" fill="#64dfed" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">PROMQL / METRICS</text>
<rect x="48" y="232" width="307" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="63" y="253" width="4" height="23" rx="2" fill="#64dfed" stroke="none" stroke-width="2"/>
<text x="75" y="274" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Browser</text>
<text x="75" y="308" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Explore or dashboard panel</text>
<text x="361" y="297" fill="#64dfed" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">→</text>
<rect x="393" y="232" width="307" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="408" y="253" width="4" height="23" rx="2" fill="#64dfed" stroke="none" stroke-width="2"/>
<text x="420" y="274" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Grafana server</text>
<text x="420" y="308" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Receives the query through the Route</text>
<text x="706" y="297" fill="#64dfed" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">→</text>
<rect x="738" y="232" width="307" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="753" y="253" width="4" height="23" rx="2" fill="#64dfed" stroke="none" stroke-width="2"/>
<text x="765" y="274" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Metrics proxy</text>
<text x="765" y="308" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Scopes queries to the bigdata project</text>
<text x="1051" y="297" fill="#64dfed" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">→</text>
<rect x="1083" y="232" width="307" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="1098" y="253" width="4" height="23" rx="2" fill="#64dfed" stroke="none" stroke-width="2"/>
<text x="1110" y="274" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Thanos Querier</text>
<text x="1110" y="308" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Reads OpenShift Prometheus data</text>
<text x="48" y="385" fill="#bdb1ff" font-size="20" font-weight="700" font-family="Segoe UI, Arial, sans-serif">LOGQL / LOGS</text>
<rect x="48" y="401" width="422" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="63" y="422" width="4" height="23" rx="2" fill="#bdb1ff" stroke="none" stroke-width="2"/>
<text x="75" y="443" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Browser</text>
<text x="75" y="477" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Explore with the Loki data source</text>
<text x="476" y="466" fill="#bdb1ff" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">→</text>
<rect x="508" y="401" width="422" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="523" y="422" width="4" height="23" rx="2" fill="#bdb1ff" stroke="none" stroke-width="2"/>
<text x="535" y="443" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Grafana server</text>
<text x="535" y="477" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Sends LogQL to the internal Service</text>
<text x="936" y="466" fill="#bdb1ff" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">→</text>
<rect x="968" y="401" width="422" height="108" rx="13" fill="#192942" stroke="#3d5270" stroke-width="2"/>
<rect x="983" y="422" width="4" height="23" rx="2" fill="#bdb1ff" stroke="none" stroke-width="2"/>
<text x="995" y="443" fill="#f6faff" font-size="19" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Loki</text>
<text x="995" y="477" fill="#c4d2e5" font-size="14" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Returns matching log streams</text>
<rect x="48" y="548" width="1344" height="51" rx="11" fill="#172640" stroke="none" stroke-width="2"/>
<text x="67" y="581" fill="#d8e6f7" font-size="21" font-weight="400" font-family="Segoe UI, Arial, sans-serif">Grafana returns the results to the browser, which renders time series or log lines.</text>
</svg>
