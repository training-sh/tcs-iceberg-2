<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="355" viewBox="0 0 1000 355" role="img" aria-labelledby="title"><title id="title">A named volume keeps database files when the database container is replaced</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53647a"/></marker></defs><rect width="1000" height="355" rx="18" fill="#f1f5fb"/><text x="30" y="38" font-family="Arial, sans-serif" font-size="17" fill="#53647a" font-weight="700">CONTAINER LIFETIME / DATA LIFETIME</text><rect x="30" y="95" width="300" height="90" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="129" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Old db container</text><text x="48" y="156" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Remove / recreate</text><rect x="30" y="220" width="300" height="90" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="48" y="254" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">New db container</text><text x="48" y="281" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Mount the same volume</text><path d="M345,140 L640,195" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M345,260 L640,220" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="660" y="160" width="310" height="95" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="678" y="194" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">pgdata volume</text><text x="678" y="221" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Persistent database files</text><text x="365" y="110" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">/var/lib/postgresql/data</text><text x="365" y="310" font-family="Arial, sans-serif" font-size="17" fill="#53647a" font-weight="400">Deleting the volume deletes its stored data.</text></svg>