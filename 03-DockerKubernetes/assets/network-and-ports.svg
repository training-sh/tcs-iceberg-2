<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">Browser reaches Adminer through a published port; Adminer reaches PostgreSQL through the Compose network</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53647a"/></marker></defs><rect width="1000" height="330" rx="18" fill="#f1f5fb"/><text x="30" y="38" font-family="Arial, sans-serif" font-size="17" fill="#53647a" font-weight="700">ONE COMPOSE NETWORK</text><rect x="30" y="110" width="220" height="85" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="144" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Browser</text><text x="48" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">localhost:8081</text><path d="M260,152 L355,152" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="268" y="128" font-family="Arial, sans-serif" font-size="16" fill="#14243b" font-weight="400">publish</text><rect x="365" y="110" width="265" height="85" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="383" y="144" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">adminer</text><text x="383" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Container port 8080</text><path d="M640,152 L715,152" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="647" y="128" font-family="Arial, sans-serif" font-size="16" fill="#14243b" font-weight="400">DNS</text><rect x="725" y="110" width="245" height="85" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="743" y="144" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">db</text><text x="743" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">PostgreSQL:5432</text><text x="35" y="265" font-family="Arial, sans-serif" font-size="20" fill="#14243b" font-weight="400">Host: 127.0.0.1:8081 forwards to adminer:8080</text><text x="35" y="299" font-family="Arial, sans-serif" font-size="20" fill="#14243b" font-weight="400">Inside the network: db:5432  |  No database host port is needed.</text></svg>