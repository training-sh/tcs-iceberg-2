<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="One Spark image starts a master and a worker on a Docker network"><rect width="1000" height="300" rx="18" fill="#f1f5fb"/><g font-family="Arial,sans-serif"><text x="30" y="35" font-size="17" fill="#53647a">SAME IMAGE / SAME JAVA / SAME CONNECTORS</text><rect x="30" y="65" width="280" height="105" rx="12" fill="white" stroke="#2563eb" stroke-width="2"/><text x="50" y="100" font-size="23" fill="#2563eb">Spark image</text><text x="50" y="130" font-size="17">Ubuntu + Java 11 + JARs</text><path d="M320 115 L405 115 M640 115 L720 115" fill="none" stroke="#53647a" stroke-width="3"/><rect x="415" y="65" width="215" height="105" rx="12" fill="white" stroke="#087f8c" stroke-width="2"/><text x="435" y="100" font-size="23" fill="#087f8c">spark-master</text><text x="435" y="130" font-size="17">7077 / UI 8080</text><rect x="730" y="65" width="240" height="105" rx="12" fill="white" stroke="#087f8c" stroke-width="2"/><text x="750" y="100" font-size="23" fill="#087f8c">spark-worker</text><text x="750" y="130" font-size="17">Executors / UI 8081</text><rect x="415" y="205" width="555" height="55" rx="12" fill="white" stroke="#53647a"/><text x="440" y="240" font-size="20">Shared volume: /opt/spark/data</text><path d="M520 170 L520 205 M840 170 L840 205" stroke="#53647a" stroke-width="2"/><text x="30" y="237" font-size="17">One VM, one Docker network</text></g></svg>