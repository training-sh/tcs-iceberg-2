<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">Run creates a container; stop and start reuse it; remove deletes it</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53647a"/></marker></defs><rect width="1000" height="330" rx="18" fill="#f1f5fb"/><text x="30" y="38" font-family="Arial, sans-serif" font-size="17" fill="#53647a" font-weight="700">THE CONTAINER LIFECYCLE</text><rect x="30" y="110" width="210" height="80" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="144" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Image</text><text x="48" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Still available</text><path d="M250,150 L335,150" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="266" y="128" font-family="Arial, sans-serif" font-size="17" fill="#14243b" font-weight="400">run</text><rect x="345" y="110" width="240" height="80" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="363" y="144" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">Running</text><text x="363" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Main process is active</text><path d="M590,132 L710,132" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="630" y="112" font-family="Arial, sans-serif" font-size="17" fill="#14243b" font-weight="400">stop</text><path d="M710,172 L590,172" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="630" y="207" font-family="Arial, sans-serif" font-size="17" fill="#14243b" font-weight="400">start</text><rect x="730" y="110" width="240" height="80" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="748" y="144" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Stopped</text><text x="748" y="171" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Files still exist</text><text x="35" y="277" font-family="Arial, sans-serif" font-size="20" fill="#14243b" font-weight="400">rm removes a stopped container. Its writable layer is removed too.</text></svg>