<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title"><title id="title">A Dockerfile builds an image; an image starts multiple containers</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53647a"/></marker></defs><rect width="1000" height="330" rx="18" fill="#f1f5fb"/><text x="30" y="38" font-family="Arial, sans-serif" font-size="17" fill="#53647a" font-weight="700">BUILD ONCE / START SEPARATE INSTANCES</text><rect x="30" y="105" width="230" height="85" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="139" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Dockerfile</text><text x="48" y="166" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Build instructions</text><path d="M270,147 L355,147" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="283" y="128" font-family="Arial, sans-serif" font-size="16" fill="#14243b" font-weight="400">build</text><rect x="365" y="105" width="230" height="85" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="383" y="139" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Image</text><text x="383" y="166" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">App + dependencies</text><path d="M610,130 L710,95" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M610,165 L710,235" stroke="#53647a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="730" y="55" width="240" height="85" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="748" y="89" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">Container A</text><text x="748" y="116" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Own process and files</text><rect x="730" y="195" width="240" height="85" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="748" y="229" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">Container B</text><text x="748" y="256" font-family="Arial, sans-serif" font-size="16" fill="#53647a" font-weight="400">Same starting image</text><text x="35" y="287" font-family="Arial, sans-serif" font-size="20" fill="#14243b" font-weight="400">A registry stores images. A container runs on a Docker host.</text></svg>