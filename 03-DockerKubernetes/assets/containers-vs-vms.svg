<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title"><title id="title">Virtual machines have guest operating systems; containers share the host kernel</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#53647a"/></marker></defs><rect width="1000" height="365" rx="18" fill="#f1f5fb"/><text x="30" y="38" font-family="Arial, sans-serif" font-size="18" fill="#2563eb" font-weight="700">VIRTUAL MACHINES</text><text x="530" y="38" font-family="Arial, sans-serif" font-size="18" fill="#087f8c" font-weight="700">CONTAINERS</text><rect x="30" y="65" width="210" height="75" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="99" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">App + libraries</text><rect x="30" y="155" width="210" height="60" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="189" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Guest OS</text><rect x="270" y="65" width="210" height="75" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="288" y="99" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">App + libraries</text><rect x="270" y="155" width="210" height="60" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="288" y="189" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Guest OS</text><rect x="530" y="65" width="200" height="75" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="548" y="99" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">App + libraries</text><rect x="770" y="65" width="200" height="75" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="788" y="99" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">App + libraries</text><rect x="30" y="235" width="450" height="60" rx="14" fill="white" stroke="#2563eb" stroke-width="2"/><text x="48" y="269" font-family="Arial, sans-serif" font-size="22" fill="#2563eb" font-weight="700">Hypervisor</text><rect x="530" y="155" width="440" height="60" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="548" y="189" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">Container runtime</text><rect x="530" y="235" width="440" height="60" rx="14" fill="white" stroke="#087f8c" stroke-width="2"/><text x="548" y="269" font-family="Arial, sans-serif" font-size="22" fill="#087f8c" font-weight="700">Shared host kernel</text><text x="35" y="333" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">Each VM has its own kernel.</text><text x="535" y="333" font-family="Arial, sans-serif" font-size="18" fill="#14243b" font-weight="400">Containers share the host kernel.</text></svg>