<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="title desc">
<title id="title">Trino worker scaling</title><desc id="desc">The default single pod combines coordinator and worker execution. The optional layout keeps one coordinator endpoint and adds separately configured workers. Replicating the coordinator is not worker scaling.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1100" height="490" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="44" font-size="25" font-weight="bold">Scale workers, keep one coordinator endpoint</text>
<rect x="25" y="85" width="440" height="330" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="50" y="120" font-size="21" font-weight="bold">Default: one pod</text><rect x="80" y="160" width="330" height="155" rx="12" fill="#fce7f3" stroke="#db2777"/><text x="245" y="201" text-anchor="middle" font-size="22" font-weight="bold">trino-0</text><text x="245" y="238" text-anchor="middle" font-size="19">Coordinator + execution</text><text x="245" y="277" text-anchor="middle" font-size="17">Small exercises, low overhead</text><text x="50" y="365" font-size="17">statefulset/trino: replicas = 1</text>
<rect x="500" y="85" width="575" height="330" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="525" y="120" font-size="21" font-weight="bold">Optional: separate worker workload</text><rect x="540" y="155" width="495" height="85" rx="12" fill="#fce7f3" stroke="#db2777"/><text x="787" y="190" text-anchor="middle" font-size="20" font-weight="bold">service/trino → trino-0</text><text x="787" y="218" text-anchor="middle" font-size="17">Exactly one coordinator</text>
<rect x="540" y="295" width="225" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="810" y="295" width="225" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/><text x="652" y="327" text-anchor="middle" font-size="19" font-weight="bold">trino-worker-0</text><text x="652" y="352" text-anchor="middle" font-size="16">coordinator=false</text><text x="922" y="327" text-anchor="middle" font-size="19">More workers</text><text x="922" y="352" text-anchor="middle" font-size="16">Only with real capacity</text>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"><path d="M705 240L652 295"/><path d="M870 240L922 295"/></g><text x="30" y="457" font-size="17" fill="#475569">On one CRC node, extra pods share the same CPU/RAM and do not add host-level availability.</text></g></svg>
