<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">How Trino executes an Iceberg query</title><desc id="desc">Submit SQL, plan the query, resolve the table through Polaris, inspect Iceberg metadata, scan selected files, exchange and aggregate, then fetch results.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1100" height="510" rx="18" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="30" y="46" font-size="25" font-weight="bold">SQL to results: the Iceberg path</text>
<g fill="#e0f2fe" stroke="#0284c7"><rect x="30" y="100" width="225" height="105" rx="12"/><rect x="300" y="100" width="225" height="105" rx="12"/><rect x="570" y="100" width="225" height="105" rx="12"/><rect x="840" y="100" width="225" height="105" rx="12"/></g>
<g text-anchor="middle"><text x="142" y="137" font-size="20" font-weight="bold">1. Submit SQL</text><text x="142" y="167" font-size="16">Client to coordinator</text><text x="412" y="137" font-size="20" font-weight="bold">2. Analyze + plan</text><text x="412" y="167" font-size="16">Names, access, stages</text><text x="682" y="137" font-size="20" font-weight="bold">3. Resolve table</text><text x="682" y="167" font-size="16">Polaris metadata pointer</text><text x="952" y="137" font-size="20" font-weight="bold">4. Inspect snapshot</text><text x="952" y="167" font-size="16">Manifests + file statistics</text></g>
<g fill="#dcfce7" stroke="#16a34a"><rect x="840" y="295" width="225" height="105" rx="12"/><rect x="570" y="295" width="225" height="105" rx="12"/><rect x="300" y="295" width="225" height="105" rx="12"/><rect x="30" y="295" width="225" height="105" rx="12"/></g>
<g text-anchor="middle"><text x="952" y="332" font-size="20" font-weight="bold">5. Schedule splits</text><text x="952" y="362" font-size="16">Tasks on available workers</text><text x="682" y="332" font-size="20" font-weight="bold">6. Scan files</text><text x="682" y="362" font-size="16">SeaweedFS S3 objects</text><text x="412" y="332" font-size="20" font-weight="bold">7. Exchange + merge</text><text x="412" y="362" font-size="16">Joins and aggregations</text><text x="142" y="332" font-size="20" font-weight="bold">8. Fetch results</text><text x="142" y="362" font-size="16">Client consumes pages</text></g>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"><path d="M255 152H300"/><path d="M525 152H570"/><path d="M795 152H840"/><path d="M952 205V295"/><path d="M840 347H795"/><path d="M570 347H525"/><path d="M300 347H255"/></g><text x="30" y="465" font-size="17" fill="#475569">The current single-node cluster executes coordinator and worker roles in the same pod.</text></g></svg>
