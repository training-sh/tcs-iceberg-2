<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Current Trino architecture on CRC</title><desc id="desc">CLI and browser connect to the Trino Service and one coordinator-worker pod. Trino communicates with Polaris for catalog references and SeaweedFS for objects. MySQL is another connector source.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1120" height="620" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a"><text x="36" y="48" font-size="26" font-weight="bold">One Trino pod, shared Iceberg storage</text><text x="36" y="78" font-size="17" fill="#475569">CRC / OpenShift namespace: bigdata</text>
<rect x="35" y="230" width="170" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="120" y="268" text-anchor="middle" font-size="20" font-weight="bold">SQL client</text><text x="120" y="296" text-anchor="middle" font-size="16">CLI / JDBC / HTTP</text><text x="120" y="320" text-anchor="middle" font-size="15">Browser: monitoring</text>
<rect x="255" y="230" width="170" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="340" y="267" text-anchor="middle" font-size="20" font-weight="bold">service/trino</text><text x="340" y="297" text-anchor="middle" font-size="17">Port 8080</text><text x="340" y="321" text-anchor="middle" font-size="15">Coordinator endpoint</text>
<rect x="475" y="180" width="245" height="215" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/><text x="597" y="215" text-anchor="middle" font-size="22" font-weight="bold">trino-0</text><text x="597" y="246" text-anchor="middle" font-size="18">Coordinator</text><text x="597" y="270" text-anchor="middle" font-size="15">Plan / schedule / results</text><path d="M495 286H700" stroke="#db2777"/><text x="597" y="318" text-anchor="middle" font-size="18">Worker execution</text><text x="597" y="344" text-anchor="middle" font-size="15">Scan / join / aggregate</text><text x="597" y="374" text-anchor="middle" font-size="15">Connectors: Iceberg, MySQL</text>
<rect x="815" y="115" width="260" height="100" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="945" y="151" text-anchor="middle" font-size="21" font-weight="bold">Polaris :8181</text><text x="945" y="180" text-anchor="middle" font-size="16">Catalog + access control</text><text x="945" y="201" text-anchor="middle" font-size="15">Current metadata reference</text>
<rect x="815" y="285" width="260" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="945" y="322" text-anchor="middle" font-size="21" font-weight="bold">SeaweedFS S3 :8333</text><text x="945" y="350" text-anchor="middle" font-size="16">Iceberg metadata + manifests</text><text x="945" y="375" text-anchor="middle" font-size="16">Parquet data objects</text>
<rect x="815" y="465" width="260" height="90" rx="12" fill="#fef3c7" stroke="#d97706"/><text x="945" y="501" text-anchor="middle" font-size="21" font-weight="bold">MySQL :3306</text><text x="945" y="530" text-anchor="middle" font-size="16">Separate operational source</text>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"><path d="M205 285H255"/><path d="M425 285H475"/><path d="M720 222L815 165"/><path d="M720 333H815"/><path d="M680 395L815 500"/></g>
<text x="740" y="186" font-size="14">Resolve</text><text x="739" y="318" font-size="14">Read/write</text><text x="35" y="580" font-size="17" fill="#475569">Polaris resolves table names. Trino reads object bytes directly from SeaweedFS.</text></g></svg>
