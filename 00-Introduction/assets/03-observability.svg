<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>See what the applications are doing</title><rect width="1440" height="900" fill="#F8FAFC"/><text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">See what the applications are doing</text><text x="52" y="107" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Metrics, logs, traces and lineage describe different aspects of the same work.</text><rect x="65" y="170" width="400" height="170" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="81" y="190" width="6" height="130" rx="11" fill="#2563EB" stroke="#2563EB"/><text x="101" y="215" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">APPLICATION PODS</text><text x="101" y="256" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Spark • Hadoop • Hive • Kafka</text><text x="101" y="287" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">SQL engines • databases</text><text x="101" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Instrumented jobs / clients</text><rect x="535" y="170" width="395" height="170" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="551" y="190" width="6" height="130" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="571" y="215" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">COLLECT / STORE</text><text x="571" y="256" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Prometheus  → metrics</text><text x="571" y="287" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Alloy → Loki  → logs</text><text x="571" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Jaeger  → emitted traces</text><rect x="1000" y="170" width="375" height="170" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="1016" y="190" width="6" height="130" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="1036" y="215" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">EXPLORE</text><text x="1036" y="256" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Grafana dashboards</text><text x="1036" y="287" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Jaeger trace UI</text><text x="1036" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Marquez lineage UI</text><path d="M465 255 L535 255" stroke="#64748B" stroke-width="2"/><polygon points="535,255 524.4690092573155,260.75310646325045 524.4690092573155,249.24689353674955" fill="#64748B"/><path d="M930 255 L1000 255" stroke="#64748B" stroke-width="2"/><polygon points="1000,255 989.4690092573155,260.75310646325045 989.4690092573155,249.24689353674955" fill="#64748B"/><rect x="65" y="430" width="630" height="245" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="81" y="450" width="6" height="205" rx="11" fill="#EA580C" stroke="#EA580C"/><text x="101" y="475" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#EA580C">WORKFLOW &amp; LINEAGE</text><text x="101" y="516" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Airflow runs DAG tasks and schedules workflows.</text><text x="101" y="547" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">PostgreSQL stores Airflow metadata.</text><text x="101" y="578" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">OpenLineage-enabled jobs emit lineage events.</text><text x="101" y="609" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Marquez stores lineage in PostgreSQL;</text><text x="101" y="640" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">marquez-web presents it in a browser.</text><rect x="735" y="430" width="640" height="245" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="751" y="450" width="6" height="205" rx="11" fill="#DB2777" stroke="#DB2777"/><text x="771" y="475" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#DB2777">POD AND CONTAINER DETAILS</text><text x="771" y="516" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Some lesson manifests include file-logs sidecars.</text><text x="771" y="547" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Sidecars forward selected log files to stdout.</text><text x="771" y="578" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Alloy can collect the resulting container logs.</text><text x="771" y="609" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Installing tracing / lineage services alone</text><text x="771" y="640" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">does not instrument every application.</text><text x="65" y="775" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#334155">These services are defined in the lesson manifests; use the inventory slide to see running workloads.</text><text x="52" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B">OPENSHiFT / CRC  •  DATA ENGINEERING LAB  •  Logical architecture</text></svg>