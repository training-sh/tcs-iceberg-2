<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Hadoop and Hive: who does what?</title><rect width="1440" height="900" fill="#F8FAFC"/><text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Hadoop and Hive: who does what?</text><text x="52" y="107" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Kubernetes runs the services. YARN manages Hadoop application execution inside the lab.</text><rect x="60" y="165" width="400" height="180" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="76" y="185" width="6" height="140" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="96" y="210" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">HIVE SQL</text><text x="96" y="251" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">HiveServer2 accepts SQL / JDBC</text><text x="96" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Metastore describes tables</text><text x="96" y="313" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">MySQL persists metastore rows</text><rect x="520" y="165" width="400" height="180" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="536" y="185" width="6" height="140" rx="11" fill="#EA580C" stroke="#EA580C"/><text x="556" y="210" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#EA580C">YARN SCHEDULING</text><text x="556" y="251" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">ResourceManager allocates work</text><text x="556" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">NodeManager launches processes</text><text x="556" y="313" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">HistoryServer shows finished jobs</text><rect x="980" y="165" width="400" height="180" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="996" y="185" width="6" height="140" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="1016" y="210" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">HDFS STORAGE</text><text x="1016" y="251" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">NameNode tracks block locations</text><text x="1016" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">DataNode stores the file blocks</text><text x="1016" y="313" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Separate persistent volume claims</text><path d="M460 255 L520 255" stroke="#64748B" stroke-width="2"/><polygon points="520,255 509.4690092573155,260.75310646325045 509.4690092573155,249.24689353674955" fill="#64748B"/><path d="M920 255 L980 255" stroke="#64748B" stroke-width="2"/><polygon points="980,255 969.4690092573155,260.75310646325045 969.4690092573155,249.24689353674955" fill="#64748B"/><rect x="60" y="405" width="630" height="170" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="76" y="425" width="6" height="130" rx="11" fill="#EA580C" stroke="#EA580C"/><text x="96" y="450" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#EA580C">PODS / CONTAINERS</text><text x="96" y="491" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">resourcemanager-*  [resourcemanager]</text><text x="96" y="522" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">nodemanager-*  [nodemanager]</text><text x="96" y="553" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">historyserver-*  [historyserver]</text><rect x="730" y="405" width="650" height="170" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="746" y="425" width="6" height="130" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="766" y="450" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">PODS / CONTAINERS</text><text x="766" y="491" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">hive-metastore-*  [hive-metastore]</text><text x="766" y="522" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">hiveserver2-*  [hiveserver2]</text><text x="766" y="553" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">namenode-0 [namenode] • datanode-0 [datanode]</text><rect x="60" y="635" width="1320" height="160" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="76" y="655" width="6" height="120" rx="11" fill="#2563EB" stroke="#2563EB"/><text x="96" y="680" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">TWO DIFFERENT MEANINGS OF “CONTAINER”</text><text x="96" y="721" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Kubernetes container: an image-based runtime unit inside a pod.</text><text x="96" y="752" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">YARN container: an allocation of memory / CPU for an application process.</text><text x="96" y="783" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">This Spark setup uses standalone master / worker scheduling, independently of YARN.</text><text x="52" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B">OPENSHiFT / CRC  •  DATA ENGINEERING LAB  •  Logical architecture</text></svg>