<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Look inside a pod</title><rect width="1440" height="900" fill="#F8FAFC"/><text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Look inside a pod</text><text x="52" y="107" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">A pod groups containers that share networking and mounted volumes.</text><rect x="45" y="155" width="1350" height="650" rx="11" fill="#EFF6FF" stroke="#93C5FD"/><text x="70" y="201" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#2563EB">Namespace: bigdata</text><rect x="75" y="235" width="610" height="265" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="91" y="255" width="6" height="225" rx="11" fill="#2563EB" stroke="#2563EB"/><text x="111" y="280" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">POD  spark-master-0</text><text x="111" y="321" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">CONTAINER  spark-master  → scheduling</text><text x="111" y="352" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">CONTAINER  spark-history  → completed jobs</text><text x="111" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">CONTAINER  jupyter  → notebook + driver</text><text x="111" y="414" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Shared pod IP • localhost between containers</text><text x="111" y="445" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">PVC mounts hold notebooks / event logs</text><rect x="725" y="235" width="590" height="265" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="741" y="255" width="6" height="225" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="761" y="280" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">POD  spark-worker-0</text><text x="761" y="321" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">CONTAINER  spark-worker</text><text x="761" y="352" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Worker launches executor JVM processes</text><text x="761" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Executors run tasks for Spark applications</text><text x="761" y="414" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Executors are processes in this layout,</text><text x="761" y="445" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">not separate Kubernetes executor pods.</text><path d="M685 350 L725 350" stroke="#64748B" stroke-width="2"/><polygon points="725,350 714.4690092573155,355.75310646325045 714.4690092573155,344.24689353674955" fill="#64748B"/><rect x="75" y="545" width="1240" height="200" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="91" y="565" width="6" height="160" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="111" y="590" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">ONE IMAGE CAN CREATE MANY CONTAINERS</text><text x="111" y="631" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">The Spark image supplies software; each container starts a different command.</text><text x="111" y="662" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Service spark-master provides a stable name while pod IPs may change.</text><text x="111" y="693" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">A pod restart replaces running containers; PVCs retain the mounted persistent data.</text><text x="52" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B">OPENSHiFT / CRC  •  DATA ENGINEERING LAB  •  Logical architecture</text></svg>