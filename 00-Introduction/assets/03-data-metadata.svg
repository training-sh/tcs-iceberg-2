<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Two warehouses. Separate metadata and data.</title><rect width="1440" height="900" fill="#F8FAFC"/><text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">Two warehouses. Separate metadata and data.</text><text x="52" y="107" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">Follow catalog calls separately from the files read and written by query engines.</text><rect x="455" y="150" width="530" height="145" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="471" y="170" width="6" height="105" rx="11" fill="#2563EB" stroke="#2563EB"/><text x="491" y="195" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">CLIENT / QUERY ENGINE</text><text x="491" y="236" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Spark + Iceberg client  /  Trino</text><rect x="75" y="380" width="570" height="155" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="91" y="400" width="6" height="115" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="111" y="425" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">POLARIS  :8181</text><text x="111" y="466" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">REST catalog → table registration / locations</text><text x="111" y="497" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Backend: PostgreSQL database polaris</text><rect x="800" y="380" width="570" height="155" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="816" y="400" width="6" height="115" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="836" y="425" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">SEAWEEDFS S3  :8333</text><text x="836" y="466" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">s3://warehouse/iceberg</text><text x="836" y="497" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Iceberg metadata JSON, manifests + data files</text><path d="M540 295 L360 380" stroke="#64748B" stroke-width="2"/><polygon points="360,380 367.0660213924765,370.30096181670245 371.9792468634575,380.7054392846621" fill="#64748B"/><text x="458.0" y="328.5" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B">catalog calls</text><path d="M900 295 L1080 380" stroke="#64748B" stroke-width="2"/><polygon points="1080,380 1068.0207531365425,380.7054392846621 1072.9339786075234,370.30096181670245" fill="#64748B"/><text x="998.0" y="328.5" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B">file I/O</text><rect x="75" y="635" width="570" height="155" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="91" y="655" width="6" height="115" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="111" y="680" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">HIVE METASTORE  :9083</text><text x="111" y="721" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Table / column / partition definitions</text><text x="111" y="752" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Backend: MySQL database hive_metastore</text><rect x="800" y="635" width="570" height="155" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="816" y="655" width="6" height="115" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="836" y="680" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">HDFS  :9000</text><text x="836" y="721" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">NameNode: namespace + block locations</text><text x="836" y="752" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">DataNode: actual file blocks on disk</text><text x="75" y="593" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#475569">HiveServer2 / configured Hive clients use the Hive metadata and HDFS paths.</text><path d="M645 710 L800 710" stroke="#64748B" stroke-width="2"/><polygon points="800,710 789.4690092573155,715.7531064632504 789.4690092573155,704.2468935367496" fill="#64748B"/><text x="730.5" y="701.0" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#64748B">locations</text><text x="52" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B">OPENSHiFT / CRC  •  DATA ENGINEERING LAB  •  Logical architecture</text></svg>