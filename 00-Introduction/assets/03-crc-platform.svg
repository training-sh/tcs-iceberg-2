<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>CRC also runs the OpenShift platform</title><rect width="1440" height="900" fill="#F8FAFC"/><text x="52" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0F172A">CRC also runs the OpenShift platform</text><text x="52" y="107" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#475569">System pods live mainly in openshift-* namespaces, alongside the bigdata project.</text><rect x="55" y="160" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="71" y="180" width="6" height="200" rx="11" fill="#2563EB" stroke="#2563EB"/><text x="91" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#2563EB">CONTROL PLANE</text><text x="91" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">kube-apiserver • etcd</text><text x="91" y="277" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">kube-scheduler • controller-manager</text><text x="91" y="308" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Cluster state and reconciliation</text><rect x="510" y="160" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="526" y="180" width="6" height="200" rx="11" fill="#0D9488" stroke="#0D9488"/><text x="546" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0D9488">NETWORK &amp; DISCOVERY</text><text x="546" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">dns-default-* • network agents</text><text x="546" y="277" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Service DNS and pod connectivity</text><text x="546" y="308" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">OVN components depend on bundle</text><rect x="965" y="160" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="981" y="180" width="6" height="200" rx="11" fill="#7C3AED" stroke="#7C3AED"/><text x="1001" y="205" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#7C3AED">BROWSER &amp; LOGIN</text><text x="1001" y="246" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">router-default-* • console-*</text><text x="1001" y="277" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">oauth-openshift-*</text><text x="1001" y="308" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Routes, cluster console and identity</text><rect x="55" y="440" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="71" y="460" width="6" height="200" rx="11" fill="#EA580C" stroke="#EA580C"/><text x="91" y="485" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#EA580C">IMAGES &amp; STORAGE</text><text x="91" y="526" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">image-registry-* • storage provisioner</text><text x="91" y="557" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Internal images and PVC provisioning</text><text x="91" y="588" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Local storage lives in the CRC VM</text><rect x="510" y="440" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="526" y="460" width="6" height="200" rx="11" fill="#DB2777" stroke="#DB2777"/><text x="546" y="485" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#DB2777">OPERATORS</text><text x="546" y="526" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">cluster-version-operator-*</text><text x="546" y="557" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">DNS / ingress / authentication operators</text><text x="546" y="588" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Manage platform desired state</text><rect x="965" y="440" width="420" height="240" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="981" y="460" width="6" height="200" rx="11" fill="#475569" stroke="#475569"/><text x="1001" y="485" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#475569">NODE SERVICES</text><text x="1001" y="526" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">kubelet + CRI-O: host services</text><text x="1001" y="557" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">Run and supervise pod containers</text><text x="1001" y="588" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#334155">They are not ordinary application pods</text><text x="60" y="779" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#334155">Pod names include generated suffixes; inspect the cluster for its exact names and containers.</text><text x="60" y="817" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#334155">CRC disables cluster monitoring by default; application monitoring is a separate stack.</text><text x="52" y="871" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#64748B">OPENSHiFT / CRC  •  DATA ENGINEERING LAB  •  Logical architecture</text></svg>